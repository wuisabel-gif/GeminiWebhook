name=GeminiWebhook
version=0.1.2
author=Isabel Wu
license=MIT
sentence=Send text to Google Gemini (or any AI model) through a Particle webhook, with a rate limit, a reply timeout, and error reporting.
paragraph=Handles the parts that are the same in every project: publishing no more often than a free quota allows, knowing whether a reply is still pending, giving up when no reply comes, and telling you when the webhook reports an error. You write the webhook, subscribe to its reply, and unpack the JSON. The API key stays in the webhook, never in firmware.
